<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>车辆动态管理</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { background-color: #f5f7fa; min-height: 100vh; margin: 0; padding: 20px; }
    .page-header { margin-bottom: 30px; }
    .page-title { font-size: 28px; font-weight: bold; margin: 0 0 8px 0; color: #303133; }
    .page-subtitle { font-size: 14px; color: #909399; margin: 0; }
    .card { background-color: #fff; border-radius: 4px; box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1); margin-bottom: 20px; }
    .card-header { padding: 15px 20px; border-bottom: 1px solid #ebeef5; display: flex; justify-content: space-between; align-items: center; }
    .card-header span { font-size: 18px; font-weight: 600; color: #303133; }
    .card-body { padding: 20px; }
    .search-form { display: flex; flex-wrap: wrap; gap: 15px; padding: 15px; background-color: #f0f2f5; border-radius: 4px; margin-bottom: 20px; }
    .search-item { display: flex; align-items: center; gap: 10px; }
    .search-item label { white-space: nowrap; color: #606266; font-weight: 500; }
    .search-item input { padding: 8px 12px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 14px; min-width: 150px; }
    .search-item input:focus { outline: none; border-color: #409eff; }
    .search-actions { display: flex; gap: 10px; margin-left: auto; }
    table { width: 100%; border-collapse: collapse; }
    table th, table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ebeef5; }
    table th { background-color: #f5f7fa; font-weight: 600; color: #606266; }
    table tbody tr:hover { background-color: #f5f7fa; }
    .btn { padding: 8px 16px; border-radius: 4px; border: 1px solid #dcdfe6; background-color: #fff; color: #606266; cursor: pointer; font-size: 14px; transition: all 0.3s; }
    .btn:hover { border-color: #409eff; color: #409eff; }
    .btn-primary { background-color: #409eff; border-color: #409eff; color: #fff; }
    .btn-primary:hover { background-color: #66b1ff; border-color: #66b1ff; }
    .btn-danger { background-color: #f56c6c; border-color: #f56c6c; color: #fff; }
    .btn-danger:hover { background-color: #f78989; border-color: #f78989; }
    .btn-small { padding: 5px 10px; font-size: 12px; }
    .pagination { margin-top: 20px; display: flex; justify-content: flex-end; align-items: center; gap: 5px; }
    .pagination button { padding: 6px 12px; border: 1px solid #dcdfe6; background-color: #fff; color: #606266; cursor: pointer; border-radius: 4px; }
    .pagination button:hover:not(:disabled) { border-color: #409eff; color: #409eff; }
    .pagination button.active { background-color: #409eff; border-color: #409eff; color: #fff; }
    .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 0, 0, 0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .modal { background-color: #fff; border-radius: 4px; min-width: 500px; max-width: 90vw; max-height: 90vh; overflow: auto; }
    .modal-header { padding: 15px 20px; border-bottom: 1px solid #ebeef5; display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { font-size: 18px; font-weight: 600; margin: 0; }
    .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: #909399; }
    .modal-close:hover { color: #606266; }
    .modal-body { padding: 20px; }
    .modal-footer { padding: 15px 20px; border-top: 1px solid #ebeef5; display: flex; justify-content: flex-end; gap: 10px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: 500; color: #606266; }
    .form-group input, .form-group textarea { width: 100%; padding: 8px 12px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
    .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #409eff; }
    .loading { display: flex; justify-content: center; align-items: center; padding: 40px; color: #909399; }
    .loading::after { content: ''; width: 30px; height: 30px; border: 3px solid #dcdfe6; border-top-color: #409eff; border-radius: 50%; animation: spin 1s linear infinite; margin-left: 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .action-buttons { display: flex; gap: 5px; }
  </style>
</head>
<body>
  <div class="page-header">
    <h1 class="page-title">车辆动态管理</h1>
    <p class="page-subtitle">管理车辆动态信息</p>
  </div>

  <div class="card">
    <div class="card-header">
      <span>车辆动态列表</span>
      <button class="btn btn-primary" onclick="openDynamicDialog()">+ 新增车辆动态</button>
    </div>
    <div class="card-body">
      <div class="search-form">
        <div class="search-item">
          <label>车牌:</label>
          <input type="text" id="searchPlate" placeholder="请输入车牌">
        </div>
        <div class="search-item">
          <label>故障现象:</label>
          <input type="text" id="searchFault" placeholder="请输入故障现象">
        </div>
        <div class="search-item">
          <label>相关人员:</label>
          <input type="text" id="searchPerson" placeholder="请输入相关人员">
        </div>
        <div class="search-actions">
          <button class="btn btn-primary" onclick="handleSearch()">搜索</button>
          <button class="btn" onclick="resetSearch()">重置</button>
        </div>
      </div>

      <div id="loading" class="loading" style="display: none;">加载中...</div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th><input type="checkbox" id="selectAll"></th>
              <th>ID</th>
              <th>车牌</th>
              <th>故障现象</th>
              <th>起始日期</th>
              <th>结束日期</th>
              <th>相关人员</th>
              <th>备注</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="dynamicTableBody"></tbody>
        </table>
      </div>

      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <div id="dynamicModal" style="display: none;">
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
          <h3 id="modalTitle">新增车辆动态</h3>
          <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
          <form id="dynamicForm">
            <input type="hidden" id="dynamicId">
            <div class="form-group">
              <label>车牌 <span style="color: #f56c6c">*</span></label>
              <input type="text" id="plateNumber" placeholder="请输入车牌" required>
            </div>
            <div class="form-group">
              <label>故障现象 <span style="color: #f56c6c">*</span></label>
              <textarea id="faultPhenomenon" rows="3" placeholder="请输入故障现象"></textarea>
            </div>
            <div class="form-group">
              <label>起始日期 <span style="color: #f56c6c">*</span></label>
              <input type="date" id="startDate" required>
            </div>
            <div class="form-group">
              <label>结束日期 <span style="color: #f56c6c">*</span></label>
              <input type="date" id="endDate">
            </div>
            <div class="form-group">
              <label>相关人员 <span style="color: #f56c6c">*</span></label>
              <input type="text" id="relatedPersonnel" placeholder="请输入相关人员">
            </div>
            <div class="form-group">
              <label>备注</label>
              <textarea id="remarks" rows="3" placeholder="请输入备注"></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn" onclick="closeModal()">取消</button>
          <button class="btn btn-primary" onclick="saveDynamic()">保存</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/utils.js"></script>
  <script>
    let dynamicList = [];
    let currentPage = 1;
    let pageSize = 10;
    let total = 0;
    let isEdit = false;

    async function loadDynamic() {
      const loading = document.getElementById('loading');
      loading.style.display = 'flex';

      const searchPlate = document.getElementById('searchPlate').value;
      const searchFault = document.getElementById('searchFault').value;
      const searchPerson = document.getElementById('searchPerson').value;

      try {
        const params = { page: currentPage, page_size: pageSize };
        if (searchPlate) params.plate_number = searchPlate;
        if (searchFault) params.fault_phenomenon = searchFault;
        if (searchPerson) params.related_personnel = searchPerson;

        const response = await http.get('/vehicle_dynamic/', params);
        dynamicList = response.data || [];
        total = dynamicList.length;
        renderTable();
        renderPagination();
      } catch (error) {
        console.error('获取车辆动态失败:', error);
        showMessage('获取车辆动态失败', 'error');
      } finally {
        loading.style.display = 'none';
      }
    }

    function renderTable() {
      const tbody = document.getElementById('dynamicTableBody');
      tbody.innerHTML = '';

      dynamicList.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><input type="checkbox" data-id="${item.id}"></td>
          <td>${item.id}</td>
          <td>${item.plate_number || '-'}</td>
          <td>${item.fault_phenomenon || '-'}</td>
          <td>${item.start_date || '-'}</td>
          <td>${item.end_date || '-'}</td>
          <td>${item.related_personnel || '-'}</td>
          <td>${item.remarks || '-'}</td>
          <td class="action-buttons">
            <button class="btn btn-small" onclick="editDynamic(${item.id})">编辑</button>
            <button class="btn btn-small btn-danger" onclick="deleteDynamic(${item.id})">删除</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function renderPagination() {
      const totalPages = Math.ceil(total / pageSize) || 1;
      const pagination = document.getElementById('pagination');
      pagination.innerHTML = '';

      const prevBtn = document.createElement('button');
      prevBtn.textContent = '上一页';
      prevBtn.disabled = currentPage <= 1;
      prevBtn.onclick = () => { currentPage--; loadDynamic(); };
      pagination.appendChild(prevBtn);

      for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement('button');
        btn.textContent = i;
        if (i === currentPage) btn.classList.add('active');
        btn.onclick = () => { currentPage = i; loadDynamic(); };
        pagination.appendChild(btn);
      }

      const nextBtn = document.createElement('button');
      nextBtn.textContent = '下一页';
      nextBtn.disabled = currentPage >= totalPages;
      nextBtn.onclick = () => { currentPage++; loadDynamic(); };
      pagination.appendChild(nextBtn);
    }

    function handleSearch() { currentPage = 1; loadDynamic(); }
    function resetSearch() {
      document.getElementById('searchPlate').value = '';
      document.getElementById('searchFault').value = '';
      document.getElementById('searchPerson').value = '';
      currentPage = 1;
      loadDynamic();
    }

    function openDynamicDialog(item = null) {
      isEdit = !!item;
      document.getElementById('modalTitle').textContent = isEdit ? '编辑车辆动态' : '新增车辆动态';
      document.getElementById('dynamicForm').reset();
      document.getElementById('dynamicId').value = '';

      if (item) {
        document.getElementById('dynamicId').value = item.id;
        document.getElementById('plateNumber').value = item.plate_number || '';
        document.getElementById('faultPhenomenon').value = item.fault_phenomenon || '';
        document.getElementById('startDate').value = item.start_date ? item.start_date.split(' ')[0] : '';
        document.getElementById('endDate').value = item.end_date ? item.end_date.split(' ')[0] : '';
        document.getElementById('relatedPersonnel').value = item.related_personnel || '';
        document.getElementById('remarks').value = item.remarks || '';
      }

      document.getElementById('dynamicModal').style.display = 'block';
    }

    function closeModal(event) {
      if (event && event.target !== event.currentTarget) return;
      document.getElementById('dynamicModal').style.display = 'none';
    }

    async function saveDynamic() {
      const formData = {
        plate_number: document.getElementById('plateNumber').value,
        fault_phenomenon: document.getElementById('faultPhenomenon').value,
        start_date: document.getElementById('startDate').value,
        end_date: document.getElementById('endDate').value,
        related_personnel: document.getElementById('relatedPersonnel').value,
        remarks: document.getElementById('remarks').value
      };

      const id = document.getElementById('dynamicId').value;

      try {
        if (isEdit) {
          formData.id = id;
          await http.put(`/vehicle_dynamic/${id}`, formData);
          showMessage('编辑成功', 'success');
        } else {
          await http.post('/vehicle_dynamic/', formData);
          showMessage('新增成功', 'success');
        }
        closeModal();
        loadDynamic();
      } catch (error) {
        showMessage(error.message || '保存失败', 'error');
      }
    }

    function editDynamic(id) {
      const item = dynamicList.find(d => d.id === id);
      if (item) openDynamicDialog(item);
    }

    async function deleteDynamic(id) {
      const confirmed = await showConfirm('确定要删除该车辆动态吗？', '删除确认');
      if (!confirmed) return;
      try {
        await http.delete(`/vehicle_dynamic/${id}`);
        showMessage('删除成功', 'success');
        loadDynamic();
      } catch (error) {
        showMessage('删除失败', 'error');
      }
    }

    document.getElementById('selectAll').addEventListener('change', function() {
      document.querySelectorAll('#dynamicTableBody input[type="checkbox"]').forEach(cb => cb.checked = this.checked);
    });

    loadDynamic();
  </script>
</body>
</html>
