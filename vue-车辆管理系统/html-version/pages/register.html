<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - 车辆管理系统</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #4886e3;
      background-image: url('../static/imgs/loginbg3.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center center;
    }

    .register-container {
      width: 100%;
      max-width: 400px;
      padding: 30px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
    }

    .register-title {
      text-align: center;
      margin-bottom: 24px;
      color: #303133;
      font-size: 24px;
    }

    .register-form {
      width: 100%;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
      color: #606266;
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }

    .form-control:focus {
      outline: none;
      border-color: #409eff;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #909399;
    }

    .form-control.with-icon {
      padding-left: 35px;
    }

    .error-message {
      color: #f56c6c;
      font-size: 12px;
      margin-top: 5px;
    }

    .register-button {
      width: 100%;
      padding: 12px;
      background-color: #409eff;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .register-button:hover {
      background-color: #66b1ff;
    }

    .register-button:disabled {
      background-color: #a0cfff;
      cursor: not-allowed;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
      color: #606266;
      font-size: 14px;
    }

    .login-link a {
      color: #409eff;
      text-decoration: none;
    }

    .login-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="register-container">
    <h2 class="register-title">注册</h2>
    <form class="register-form" id="registerForm">
      <div class="form-group">
        <label for="username">用户名</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input type="text" id="username" name="username" class="form-control with-icon" placeholder="请输入用户名" required>
        </div>
        <div class="error-message" id="usernameError"></div>
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input type="password" id="password" name="password" class="form-control with-icon" placeholder="请输入密码" required>
        </div>
        <div class="error-message" id="passwordError"></div>
      </div>
      <div class="form-group">
        <label for="confirmPassword">确认密码</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input type="password" id="confirmPassword" name="confirmPassword" class="form-control with-icon" placeholder="请确认密码" required>
        </div>
        <div class="error-message" id="confirmPasswordError"></div>
      </div>
      <div class="form-group">
        <button type="submit" class="register-button" id="registerBtn">注册</button>
      </div>
    </form>
    <div class="login-link">
      <span>已有账号？</span>
      <a href="login.html">去登录</a>
    </div>
  </div>

  <script src="../js/utils.js"></script>
  <script>
    const form = document.getElementById('registerForm');
    const registerBtn = document.getElementById('registerBtn');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const usernameError = document.getElementById('usernameError');
    const passwordError = document.getElementById('passwordError');
    const confirmPasswordError = document.getElementById('confirmPasswordError');

    function validateForm() {
      let isValid = true;
      usernameError.textContent = '';
      passwordError.textContent = '';
      confirmPasswordError.textContent = '';

      if (!usernameInput.value.trim()) {
        usernameError.textContent = '请输入用户名';
        isValid = false;
      } else if (usernameInput.value.length < 3 || usernameInput.value.length > 20) {
        usernameError.textContent = '用户名长度在 3 到 20 个字符';
        isValid = false;
      }

      if (!passwordInput.value.trim()) {
        passwordError.textContent = '请输入密码';
        isValid = false;
      } else if (passwordInput.value.length < 6 || passwordInput.value.length > 20) {
        passwordError.textContent = '密码长度在 6 到 20 个字符';
        isValid = false;
      }

      if (!confirmPasswordInput.value.trim()) {
        confirmPasswordError.textContent = '请确认密码';
        isValid = false;
      } else if (confirmPasswordInput.value !== passwordInput.value) {
        confirmPasswordError.textContent = '两次输入密码不一致';
        isValid = false;
      }

      return isValid;
    }

    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      if (!validateForm()) {
        return;
      }

      registerBtn.disabled = true;
      registerBtn.textContent = '注册中...';

      try {
        const response = await http.post('/register', {
          username: usernameInput.value,
          password: passwordInput.value,
          role: ''
        });

        if (response.status === 201) {
          showMessage('注册成功，请登录', 'success');
          setTimeout(() => {
            window.location.href = 'login.html';
          }, 500);
        } else {
          showMessage(response.message || '注册失败，请稍后重试', 'error');
        }
      } catch (error) {
        console.error('注册请求失败:', error);
        showMessage(error.message || '注册失败，请稍后重试', 'error');
      } finally {
        registerBtn.disabled = false;
        registerBtn.textContent = '注册';
      }
    });

    usernameInput.addEventListener('blur', validateForm);
    passwordInput.addEventListener('blur', validateForm);
    confirmPasswordInput.addEventListener('blur', validateForm);
  </script>
</body>
</html>
