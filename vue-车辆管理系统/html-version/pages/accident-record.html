<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>事故记录管理</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { background-color: #f5f7fa; min-height: 100vh; margin: 0; padding: 20px; }
    .page-header { margin-bottom: 30px; }
    .page-title { font-size: 28px; font-weight: bold; margin: 0 0 8px 0; color: #303133; }
    .page-subtitle { font-size: 14px; color: #909399; margin: 0; }
    .card { background-color: #fff; border-radius: 4px; box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1); margin-bottom: 20px; }
    .card-header { padding: 15px 20px; border-bottom: 1px solid #ebeef5; display: flex; justify-content: space-between; align-items: center; }
    .card-header span { font-size: 18px; font-weight: 600; color: #303133; }
    .card-body { padding: 20px; }
    .search-form { display: flex; flex-wrap: wrap; gap: 15px; padding: 15px; background-color: #f0f2f5; border-radius: 4px; margin-bottom: 20px; }
    .search-item { display: flex; align-items: center; gap: 10px; }
    .search-item label { white-space: nowrap; color: #606266; font-weight: 500; }
    .search-item input, .search-item select { padding: 8px 12px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 14px; min-width: 150px; }
    .search-item input:focus, .search-item select:focus { outline: none; border-color: #409eff; }
    .search-actions { display: flex; gap: 10px; margin-left: auto; }
    table { width: 100%; border-collapse: collapse; }
    table th, table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ebeef5; }
    table th { background-color: #f5f7fa; font-weight: 600; color: #606266; }
    table tbody tr:hover { background-color: #f5f7fa; }
    .btn { padding: 8px 16px; border-radius: 4px; border: 1px solid #dcdfe6; background-color: #fff; color: #606266; cursor: pointer; font-size: 14px; transition: all 0.3s; }
    .btn:hover { border-color: #409eff; color: #409eff; }
    .btn-primary { background-color: #409eff; border-color: #409eff; color: #fff; }
    .btn-primary:hover { background-color: #66b1ff; border-color: #66b1ff; }
    .btn-danger { background-color: #f56c6c; border-color: #f56c6c; color: #fff; }
    .btn-danger:hover { background-color: #f78989; border-color: #f78989; }
    .btn-small { padding: 5px 10px; font-size: 12px; }
    .pagination { margin-top: 20px; display: flex; justify-content: flex-end; align-items: center; gap: 5px; }
    .pagination button { padding: 6px 12px; border: 1px solid #dcdfe6; background-color: #fff; color: #606266; cursor: pointer; border-radius: 4px; }
    .pagination button:hover:not(:disabled) { border-color: #409eff; color: #409eff; }
    .pagination button.active { background-color: #409eff; border-color: #409eff; color: #fff; }
    .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
    .tag { display: inline-block; padding: 2px 8px; font-size: 12px; border-radius: 4px; }
    .tag-success { background-color: #f0f9ff; color: #67c23a; }
    .tag-danger { background-color: #fef0f0; color: #f56c6c; }
    .tag-warning { background-color: #fdf6ec; color: #e6a23c; }
    .tag-info { background-color: #f4f4f5; color: #909399; }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 0, 0, 0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .modal { background-color: #fff; border-radius: 4px; min-width: 500px; max-width: 90vw; max-height: 90vh; overflow: auto; }
    .modal-header { padding: 15px 20px; border-bottom: 1px solid #ebeef5; display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { font-size: 18px; font-weight: 600; margin: 0; }
    .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: #909399; }
    .modal-close:hover { color: #606266; }
    .modal-body { padding: 20px; }
    .modal-footer { padding: 15px 20px; border-top: 1px solid #ebeef5; display: flex; justify-content: flex-end; gap: 10px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: 500; color: #606266; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 8px 12px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { outline: none; border-color: #409eff; }
    .loading { display: flex; justify-content: center; align-items: center; padding: 40px; color: #909399; }
    .loading::after { content: ''; width: 30px; height: 30px; border: 3px solid #dcdfe6; border-top-color: #409eff; border-radius: 50%; animation: spin 1s linear infinite; margin-left: 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .action-buttons { display: flex; gap: 5px; }
  </style>
</head>
<body>
  <div class="page-header">
    <h1 class="page-title">事故记录管理</h1>
    <p class="page-subtitle">管理事故记录信息</p>
  </div>

  <div class="card">
    <div class="card-header">
      <span>事故记录列表</span>
      <button class="btn btn-primary" onclick="openRecordDialog()">+ 新增事故记录</button>
    </div>
    <div class="card-body">
      <div class="search-form">
        <div class="search-item">
          <label>司机姓名:</label>
          <input type="text" id="searchDriver" placeholder="请输入司机姓名">
        </div>
        <div class="search-item">
          <label>车牌号:</label>
          <input type="text" id="searchPlate" placeholder="请输入车牌号">
        </div>
        <div class="search-item">
          <label>发生日期:</label>
          <input type="date" id="searchDate">
        </div>
        <div class="search-actions">
          <button class="btn btn-primary" onclick="handleSearch()">搜索</button>
          <button class="btn" onclick="resetSearch()">重置</button>
        </div>
      </div>

      <div id="loading" class="loading" style="display: none;">加载中...</div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th><input type="checkbox" id="selectAll"></th>
              <th>ID</th>
              <th>发生日期</th>
              <th>司机姓名</th>
              <th>车牌号</th>
              <th>责任认定</th>
              <th>案件号</th>
              <th>备注</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="recordsTableBody"></tbody>
        </table>
      </div>

      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <div id="recordModal" style="display: none;">
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
          <h3 id="modalTitle">新增事故记录</h3>
          <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
          <form id="recordForm">
            <input type="hidden" id="recordId">
            <div class="form-group">
              <label>发生日期</label>
              <input type="date" id="occurrenceDate">
            </div>
            <div class="form-group">
              <label>司机姓名</label>
              <input type="text" id="driverName" placeholder="请输入司机姓名">
            </div>
            <div class="form-group">
              <label>车牌号</label>
              <input type="text" id="plateNumber" placeholder="请输入车牌号">
            </div>
            <div class="form-group">
              <label>责任认定</label>
              <select id="liability">
                <option value="">请选择</option>
                <option value="primary">全责</option>
                <option value="secondary">主责</option>
                <option value="equal">同等责任</option>
                <option value="minor">次责</option>
                <option value="none">无责</option>
              </select>
            </div>
            <div class="form-group">
              <label>案件号</label>
              <input type="text" id="caseNumber" placeholder="请输入案件号">
            </div>
            <div class="form-group">
              <label>备注</label>
              <textarea id="remarks" rows="3" placeholder="请输入备注"></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn" onclick="closeModal()">取消</button>
          <button class="btn btn-primary" onclick="saveRecord()">保存</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/utils.js"></script>
  <script>
    let recordsList = [];
    let currentPage = 1;
    let pageSize = 10;
    let total = 0;
    let isEdit = false;

    async function loadRecords() {
      const loading = document.getElementById('loading');
      loading.style.display = 'flex';

      const searchDriver = document.getElementById('searchDriver').value;
      const searchPlate = document.getElementById('searchPlate').value;
      const searchDate = document.getElementById('searchDate').value;

      try {
        const params = { page: currentPage, page_size: pageSize };
        if (searchDriver) params.driver_name = searchDriver;
        if (searchPlate) params.plate_number = searchPlate;
        if (searchDate) params.occurrence_date = searchDate;

        const response = await http.get('/accident_record/', params);
        recordsList = response.data || [];
        total = recordsList.length;
        renderTable();
        renderPagination();
      } catch (error) {
        console.error('获取事故记录失败:', error);
        showMessage('获取事故记录失败', 'error');
      } finally {
        loading.style.display = 'none';
      }
    }

    function getResponsibilityText(responsibility) {
      const map = { primary: '全责', secondary: '主责', equal: '同等责任', minor: '次责', none: '无责' };
      return map[responsibility] || responsibility || '-';
    }

    function getResponsibilityClass(responsibility) {
      if (responsibility === 'primary') return 'tag-danger';
      if (responsibility === 'secondary') return 'tag-warning';
      return 'tag-info';
    }

    function renderTable() {
      const tbody = document.getElementById('recordsTableBody');
      tbody.innerHTML = '';

      recordsList.forEach(record => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><input type="checkbox" data-id="${record.id}"></td>
          <td>${record.id}</td>
          <td>${record.occurrence_date || '-'}</td>
          <td>${record.driver_name || '-'}</td>
          <td>${record.plate_number || '-'}</td>
          <td><span class="tag ${getResponsibilityClass(record.liability_determination)}">${getResponsibilityText(record.liability_determination)}</span></td>
          <td>${record.case_number || '-'}</td>
          <td>${record.remarks || '-'}</td>
          <td class="action-buttons">
            <button class="btn btn-small" onclick="editRecord(${record.id})">编辑</button>
            <button class="btn btn-small btn-danger" onclick="deleteRecord(${record.id})">删除</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function renderPagination() {
      const totalPages = Math.ceil(total / pageSize) || 1;
      const pagination = document.getElementById('pagination');
      pagination.innerHTML = '';

      const prevBtn = document.createElement('button');
      prevBtn.textContent = '上一页';
      prevBtn.disabled = currentPage <= 1;
      prevBtn.onclick = () => { currentPage--; loadRecords(); };
      pagination.appendChild(prevBtn);

      for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement('button');
        btn.textContent = i;
        if (i === currentPage) btn.classList.add('active');
        btn.onclick = () => { currentPage = i; loadRecords(); };
        pagination.appendChild(btn);
      }

      const nextBtn = document.createElement('button');
      nextBtn.textContent = '下一页';
      nextBtn.disabled = currentPage >= totalPages;
      nextBtn.onclick = () => { currentPage++; loadRecords(); };
      pagination.appendChild(nextBtn);
    }

    function handleSearch() { currentPage = 1; loadRecords(); }
    function resetSearch() {
      document.getElementById('searchDriver').value = '';
      document.getElementById('searchPlate').value = '';
      document.getElementById('searchDate').value = '';
      currentPage = 1;
      loadRecords();
    }

    function openRecordDialog(record = null) {
      isEdit = !!record;
      document.getElementById('modalTitle').textContent = isEdit ? '编辑事故记录' : '新增事故记录';
      document.getElementById('recordForm').reset();
      document.getElementById('recordId').value = '';

      if (record) {
        document.getElementById('recordId').value = record.id;
        document.getElementById('occurrenceDate').value = record.occurrence_date ? record.occurrence_date.split(' ')[0] : '';
        document.getElementById('driverName').value = record.driver_name || '';
        document.getElementById('plateNumber').value = record.plate_number || '';
        document.getElementById('liability').value = record.liability_determination || '';
        document.getElementById('caseNumber').value = record.case_number || '';
        document.getElementById('remarks').value = record.remarks || '';
      }

      document.getElementById('recordModal').style.display = 'block';
    }

    function closeModal(event) {
      if (event && event.target !== event.currentTarget) return;
      document.getElementById('recordModal').style.display = 'none';
    }

    async function saveRecord() {
      const formData = {
        occurrence_date: document.getElementById('occurrenceDate').value,
        driver_name: document.getElementById('driverName').value,
        plate_number: document.getElementById('plateNumber').value,
        liability_determination: document.getElementById('liability').value,
        case_number: document.getElementById('caseNumber').value,
        remarks: document.getElementById('remarks').value
      };

      const id = document.getElementById('recordId').value;

      try {
        if (isEdit) {
          formData.id = id;
          await http.put(`/accident_record/${id}`, formData);
          showMessage('编辑成功', 'success');
        } else {
          await http.post('/accident_record/', formData);
          showMessage('新增成功', 'success');
        }
        closeModal();
        loadRecords();
      } catch (error) {
        console.error('保存失败:', error);
        showMessage(error.message || '保存失败', 'error');
      }
    }

    function editRecord(id) {
      const record = recordsList.find(r => r.id === id);
      if (record) openRecordDialog(record);
    }

    async function deleteRecord(id) {
      const confirmed = await showConfirm('确定要删除该事故记录吗？', '删除确认');
      if (!confirmed) return;
      try {
        await http.delete(`/accident_record/${id}`);
        showMessage('删除成功', 'success');
        loadRecords();
      } catch (error) {
        showMessage('删除失败', 'error');
      }
    }

    document.getElementById('selectAll').addEventListener('change', function() {
      document.querySelectorAll('#recordsTableBody input[type="checkbox"]').forEach(cb => cb.checked = this.checked);
    });

    loadRecords();
  </script>
</body>
</html>
