<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用户管理</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { background-color: #f5f7fa; min-height: 100vh; margin: 0; padding: 20px; }
    .page-header { margin-bottom: 30px; }
    .page-title { font-size: 28px; font-weight: bold; margin: 0 0 8px 0; color: #303133; }
    .page-subtitle { font-size: 14px; color: #909399; margin: 0; }
    .card { background-color: #fff; border-radius: 4px; box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1); margin-bottom: 20px; }
    .card-header { padding: 15px 20px; border-bottom: 1px solid #ebeef5; display: flex; justify-content: space-between; align-items: center; }
    .card-header span { font-size: 18px; font-weight: 600; color: #303133; }
    .card-body { padding: 20px; }
    .search-form { display: flex; flex-wrap: wrap; gap: 15px; padding: 15px; background-color: #f0f2f5; border-radius: 4px; margin-bottom: 20px; }
    .search-item { display: flex; align-items: center; gap: 10px; }
    .search-item label { white-space: nowrap; color: #606266; font-weight: 500; }
    .search-item input, .search-item select { padding: 8px 12px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 14px; min-width: 150px; }
    .search-item input:focus, .search-item select:focus { outline: none; border-color: #409eff; }
    .search-actions { display: flex; gap: 10px; margin-left: auto; }
    table { width: 100%; border-collapse: collapse; }
    table th, table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ebeef5; }
    table th { background-color: #f5f7fa; font-weight: 600; color: #606266; }
    table tbody tr:hover { background-color: #f5f7fa; }
    .btn { padding: 8px 16px; border-radius: 4px; border: 1px solid #dcdfe6; background-color: #fff; color: #606266; cursor: pointer; font-size: 14px; transition: all 0.3s; }
    .btn:hover { border-color: #409eff; color: #409eff; }
    .btn-primary { background-color: #409eff; border-color: #409eff; color: #fff; }
    .btn-primary:hover { background-color: #66b1ff; border-color: #66b1ff; }
    .btn-danger { background-color: #f56c6c; border-color: #f56c6c; color: #fff; }
    .btn-danger:hover { background-color: #f78989; border-color: #f78989; }
    .btn-success { background-color: #67c23a; border-color: #67c23a; color: #fff; }
    .btn-success:hover { background-color: #85ce61; border-color: #85ce61; }
    .btn-small { padding: 5px 10px; font-size: 12px; }
    .pagination { margin-top: 20px; display: flex; justify-content: flex-end; align-items: center; gap: 5px; }
    .pagination button { padding: 6px 12px; border: 1px solid #dcdfe6; background-color: #fff; color: #606266; cursor: pointer; border-radius: 4px; }
    .pagination button:hover:not(:disabled) { border-color: #409eff; color: #409eff; }
    .pagination button.active { background-color: #409eff; border-color: #409eff; color: #fff; }
    .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
    .tag { display: inline-block; padding: 2px 8px; font-size: 12px; border-radius: 4px; }
    .tag-success { background-color: #f0f9ff; color: #67c23a; }
    .tag-warning { background-color: #fdf6ec; color: #e6a23c; }
    .tag-danger { background-color: #fef0f0; color: #f56c6c; }
    .tag-info { background-color: #f4f4f5; color: #909399; }
    .user-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
    .switch { position: relative; width: 40px; height: 20px; background-color: #dcdfe6; border-radius: 10px; cursor: pointer; transition: background-color 0.3s; display: inline-block; }
    .switch.active { background-color: #409eff; }
    .switch::after { content: ''; position: absolute; width: 16px; height: 16px; background-color: #fff; border-radius: 50%; top: 2px; left: 2px; transition: transform 0.3s; }
    .switch.active::after { transform: translateX(20px); }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 0, 0, 0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .modal { background-color: #fff; border-radius: 4px; min-width: 400px; max-width: 90vw; max-height: 90vh; overflow: auto; }
    .modal-header { padding: 15px 20px; border-bottom: 1px solid #ebeef5; display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { font-size: 18px; font-weight: 600; margin: 0; }
    .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: #909399; }
    .modal-close:hover { color: #606266; }
    .modal-body { padding: 20px; }
    .modal-footer { padding: 15px 20px; border-top: 1px solid #ebeef5; display: flex; justify-content: flex-end; gap: 10px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: 500; color: #606266; }
    .form-group input, .form-group select { width: 100%; padding: 8px 12px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: #409eff; }
    .loading { display: flex; justify-content: center; align-items: center; padding: 40px; color: #909399; }
    .loading::after { content: ''; width: 30px; height: 30px; border: 3px solid #dcdfe6; border-top-color: #409eff; border-radius: 50%; animation: spin 1s linear infinite; margin-left: 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .action-buttons { display: flex; gap: 5px; }
  </style>
</head>
<body>
  <div class="page-header">
    <h1 class="page-title">用户管理</h1>
    <p class="page-subtitle">管理系统用户信息</p>
  </div>

  <div class="card">
    <div class="card-header">
      <span>用户列表</span>
      <button class="btn btn-success" onclick="openUserDialog()">+ 新增用户</button>
    </div>
    <div class="card-body">
      <div class="search-form">
        <div class="search-item">
          <label>用户名:</label>
          <input type="text" id="searchUsername" placeholder="请输入用户名">
        </div>
        <div class="search-item">
          <label>邮箱:</label>
          <input type="text" id="searchEmail" placeholder="请输入邮箱">
        </div>
        <div class="search-item">
          <label>状态:</label>
          <select id="searchStatus">
            <option value="">全部</option>
            <option value="active">启用</option>
            <option value="inactive">禁用</option>
          </select>
        </div>
        <div class="search-actions">
          <button class="btn btn-primary" onclick="handleSearch()">搜索</button>
          <button class="btn" onclick="resetSearch()">重置</button>
        </div>
      </div>

      <div id="loading" class="loading" style="display: none;">加载中...</div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th><input type="checkbox" id="selectAll"></th>
              <th>ID</th>
              <th>头像</th>
              <th>用户名</th>
              <th>邮箱</th>
              <th>角色</th>
              <th>状态</th>
              <th>创建时间</th>
              <th>更新时间</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="usersTableBody"></tbody>
        </table>
      </div>

      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <div id="userModal" style="display: none;">
    <div class="modal-overlay" onclick="closeUserModal(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
          <h3 id="modalTitle">新增用户</h3>
          <button class="modal-close" onclick="closeUserModal()">&times;</button>
        </div>
        <div class="modal-body">
          <form id="userForm">
            <input type="hidden" id="userId">
            <div class="form-group">
              <label>用户名 <span style="color: #f56c6c">*</span></label>
              <input type="text" id="username" placeholder="请输入用户名" required>
            </div>
            <div class="form-group">
              <label>邮箱</label>
              <input type="email" id="email" placeholder="请输入邮箱">
            </div>
            <div class="form-group">
              <label>角色</label>
              <select id="role">
                <option value="user">普通用户</option>
                <option value="admin">管理员</option>
              </select>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn" onclick="closeUserModal()">取消</button>
          <button class="btn btn-primary" onclick="saveUser()">保存</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/utils.js"></script>
  <script>
    let usersList = [
      { id: 1, username: 'admin', email: 'admin@example.com', role: 'admin', status: 'active', avatar: 'https://xsgames.co/randomusers/avatar.php?g=pixel', createdAt: '2025-01-15 10:30:00', updatedAt: '2025-12-10 14:20:00' },
      { id: 2, username: 'user1', email: 'user1@example.com', role: 'user', status: 'active', avatar: 'https://xsgames.co/randomusers/avatar.php?g=female', createdAt: '2025-02-20 15:45:00', updatedAt: '2025-12-05 09:10:00' },
      { id: 3, username: 'user2', email: 'user2@example.com', role: 'user', status: 'inactive', avatar: 'https://xsgames.co/randomusers/avatar.php?g=male', createdAt: '2025-03-10 08:20:00', updatedAt: '2025-11-20 16:30:00' },
      { id: 4, username: 'user3', email: 'user3@example.com', role: 'user', status: 'active', avatar: 'https://xsgames.co/randomusers/avatar.php?g=pixel', createdAt: '2025-04-05 11:15:00', updatedAt: '2025-12-12 11:45:00' },
      { id: 5, username: 'user4', email: 'user4@example.com', role: 'user', status: 'active', avatar: 'https://xsgames.co/randomusers/avatar.php?g=female', createdAt: '2025-05-18 13:30:00', updatedAt: '2025-12-08 10:15:00' }
    ];
    let currentPage = 1;
    let pageSize = 10;
    let total = 0;
    let isEdit = false;

    function filterUsers() {
      const searchUsername = document.getElementById('searchUsername').value.toLowerCase();
      const searchEmail = document.getElementById('searchEmail').value.toLowerCase();
      const searchStatus = document.getElementById('searchStatus').value;

      return usersList.filter(user => {
        const matchUsername = !searchUsername || user.username.toLowerCase().includes(searchUsername);
        const matchEmail = !searchEmail || user.email.toLowerCase().includes(searchEmail);
        const matchStatus = !searchStatus || user.status === searchStatus;
        return matchUsername && matchEmail && matchStatus;
      });
    }

    function renderTable() {
      const filtered = filterUsers();
      total = filtered.length;

      const start = (currentPage - 1) * pageSize;
      const end = start + pageSize;
      const pageData = filtered.slice(start, end);

      const tbody = document.getElementById('usersTableBody');
      tbody.innerHTML = '';

      pageData.forEach(user => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><input type="checkbox" data-id="${user.id}"></td>
          <td>${user.id}</td>
          <td><img src="${user.avatar}" class="user-avatar" alt="avatar"></td>
          <td>${user.username}</td>
          <td>${user.email}</td>
          <td><span class="tag ${user.role === 'admin' ? 'tag-warning' : 'tag-success'}">${user.role === 'admin' ? '管理员' : '普通用户'}</span></td>
          <td><span class="switch ${user.status === 'active' ? 'active' : ''}" onclick="toggleStatus(${user.id})"></span></td>
          <td>${user.createdAt}</td>
          <td>${user.updatedAt}</td>
          <td class="action-buttons">
            <button class="btn btn-small" onclick="editUser(${user.id})">编辑</button>
            <button class="btn btn-small btn-danger" onclick="deleteUser(${user.id})">删除</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function renderPagination() {
      const totalPages = Math.ceil(total / pageSize) || 1;
      const pagination = document.getElementById('pagination');
      pagination.innerHTML = '';

      const prevBtn = document.createElement('button');
      prevBtn.textContent = '上一页';
      prevBtn.disabled = currentPage <= 1;
      prevBtn.onclick = () => { currentPage--; renderTable(); renderPagination(); };
      pagination.appendChild(prevBtn);

      for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement('button');
        btn.textContent = i;
        if (i === currentPage) btn.classList.add('active');
        btn.onclick = () => { currentPage = i; renderTable(); renderPagination(); };
        pagination.appendChild(btn);
      }

      const nextBtn = document.createElement('button');
      nextBtn.textContent = '下一页';
      nextBtn.disabled = currentPage >= totalPages;
      nextBtn.onclick = () => { currentPage++; renderTable(); renderPagination(); };
      pagination.appendChild(nextBtn);

      const info = document.createElement('span');
      info.textContent = `共 ${total} 条记录`;
      info.style.marginLeft = '15px';
      pagination.appendChild(info);
    }

    function handleSearch() {
      currentPage = 1;
      renderTable();
      renderPagination();
    }

    function resetSearch() {
      document.getElementById('searchUsername').value = '';
      document.getElementById('searchEmail').value = '';
      document.getElementById('searchStatus').value = '';
      currentPage = 1;
      renderTable();
      renderPagination();
    }

    function openUserDialog(user = null) {
      isEdit = !!user;
      document.getElementById('modalTitle').textContent = isEdit ? '编辑用户' : '新增用户';
      document.getElementById('userForm').reset();
      document.getElementById('userId').value = '';

      if (user) {
        document.getElementById('userId').value = user.id;
        document.getElementById('username').value = user.username;
        document.getElementById('email').value = user.email;
        document.getElementById('role').value = user.role;
      }

      document.getElementById('userModal').style.display = 'block';
    }

    function closeUserModal(event) {
      if (event && event.target !== event.currentTarget) return;
      document.getElementById('userModal').style.display = 'none';
    }

    function saveUser() {
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const role = document.getElementById('role').value;
      const id = document.getElementById('userId').value;

      if (!username) {
        showMessage('请输入用户名', 'error');
        return;
      }

      if (isEdit) {
        const user = usersList.find(u => u.id === parseInt(id));
        if (user) {
          user.username = username;
          user.email = email;
          user.role = role;
          user.updatedAt = new Date().toLocaleString();
        }
        showMessage('编辑成功', 'success');
      } else {
        const newId = Math.max(...usersList.map(u => u.id)) + 1;
        usersList.push({
          id: newId,
          username,
          email,
          role,
          status: 'active',
          avatar: 'https://xsgames.co/randomusers/avatar.php?g=pixel',
          createdAt: new Date().toLocaleString(),
          updatedAt: new Date().toLocaleString()
        });
        showMessage('新增成功', 'success');
      }

      closeUserModal();
      renderTable();
      renderPagination();
    }

    function editUser(id) {
      const user = usersList.find(u => u.id === id);
      if (user) openUserDialog(user);
    }

    async function deleteUser(id) {
      const confirmed = await showConfirm('确定要删除该用户吗？', '删除确认');
      if (!confirmed) return;

      usersList = usersList.filter(u => u.id !== id);
      showMessage('删除成功', 'success');
      renderTable();
      renderPagination();
    }

    function toggleStatus(id) {
      const user = usersList.find(u => u.id === id);
      if (user) {
        user.status = user.status === 'active' ? 'inactive' : 'active';
        renderTable();
      }
    }

    document.getElementById('selectAll').addEventListener('change', function() {
      document.querySelectorAll('#usersTableBody input[type="checkbox"]').forEach(cb => cb.checked = this.checked);
    });

    renderTable();
    renderPagination();
  </script>
</body>
</html>
