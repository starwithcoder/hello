<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>司机信息管理</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body {
      background-color: #f5f7fa;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .page-header {
      margin-bottom: 30px;
    }

    .page-title {
      font-size: 28px;
      font-weight: bold;
      margin: 0 0 8px 0;
      color: #303133;
    }

    .page-subtitle {
      font-size: 14px;
      color: #909399;
      margin: 0;
    }

    .card {
      background-color: #fff;
      border-radius: 4px;
      box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
      margin-bottom: 20px;
    }

    .card-header {
      padding: 15px 20px;
      border-bottom: 1px solid #ebeef5;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-header span {
      font-size: 18px;
      font-weight: 600;
      color: #303133;
    }

    .card-body {
      padding: 20px;
    }

    .search-form {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      padding: 15px;
      background-color: #f0f2f5;
      border-radius: 4px;
      margin-bottom: 20px;
    }

    .search-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-item label {
      white-space: nowrap;
      color: #606266;
      font-weight: 500;
    }

    .search-item input,
    .search-item select {
      padding: 8px 12px;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      font-size: 14px;
      min-width: 150px;
    }

    .search-item input:focus,
    .search-item select:focus {
      outline: none;
      border-color: #409eff;
    }

    .search-actions {
      display: flex;
      gap: 10px;
      margin-left: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    table th,
    table td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid #ebeef5;
    }

    table th {
      background-color: #f5f7fa;
      font-weight: 600;
      color: #606266;
    }

    table tbody tr:hover {
      background-color: #f5f7fa;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 4px;
      border: 1px solid #dcdfe6;
      background-color: #fff;
      color: #606266;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }

    .btn:hover {
      border-color: #409eff;
      color: #409eff;
    }

    .btn-primary {
      background-color: #409eff;
      border-color: #409eff;
      color: #fff;
    }

    .btn-primary:hover {
      background-color: #66b1ff;
      border-color: #66b1ff;
    }

    .btn-danger {
      background-color: #f56c6c;
      border-color: #f56c6c;
      color: #fff;
    }

    .btn-danger:hover {
      background-color: #f78989;
      border-color: #f78989;
    }

    .btn-small {
      padding: 5px 10px;
      font-size: 12px;
    }

    .pagination {
      margin-top: 20px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 5px;
    }

    .pagination button {
      padding: 6px 12px;
      border: 1px solid #dcdfe6;
      background-color: #fff;
      color: #606266;
      cursor: pointer;
      border-radius: 4px;
    }

    .pagination button:hover:not(:disabled) {
      border-color: #409eff;
      color: #409eff;
    }

    .pagination button.active {
      background-color: #409eff;
      border-color: #409eff;
      color: #fff;
    }

    .pagination button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .tag {
      display: inline-block;
      padding: 2px 8px;
      font-size: 12px;
      border-radius: 4px;
    }

    .tag-success {
      background-color: #f0f9ff;
      color: #67c23a;
    }

    .tag-warning {
      background-color: #fdf6ec;
      color: #e6a23c;
    }

    .tag-danger {
      background-color: #fef0f0;
      color: #f56c6c;
    }

    .tag-info {
      background-color: #f4f4f5;
      color: #909399;
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(0, 0, 0, 0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal {
      background-color: #fff;
      border-radius: 4px;
      min-width: 400px;
      max-width: 90vw;
      max-height: 90vh;
      overflow: auto;
    }

    .modal-header {
      padding: 15px 20px;
      border-bottom: 1px solid #ebeef5;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h3 {
      font-size: 18px;
      font-weight: 600;
      margin: 0;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #909399;
    }

    .modal-close:hover {
      color: #606266;
    }

    .modal-body {
      padding: 20px;
    }

    .modal-footer {
      padding: 15px 20px;
      border-top: 1px solid #ebeef5;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
      color: #606266;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #409eff;
    }

    .loading {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
      color: #909399;
    }

    .loading::after {
      content: '';
      width: 30px;
      height: 30px;
      border: 3px solid #dcdfe6;
      border-top-color: #409eff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-left: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .action-buttons {
      display: flex;
      gap: 5px;
    }
  </style>
</head>
<body>
  <div class="page-header">
    <h1 class="page-title">司机信息管理</h1>
    <p class="page-subtitle">管理系统司机信息</p>
  </div>

  <div class="card">
    <div class="card-header">
      <span>司机列表</span>
      <button class="btn btn-primary" onclick="openDriverDialog()">+ 新增司机</button>
    </div>
    <div class="card-body">
      <div class="search-form">
        <div class="search-item">
          <label>司机姓名:</label>
          <input type="text" id="searchName" placeholder="请输入司机姓名">
        </div>
        <div class="search-item">
          <label>手机号码:</label>
          <input type="text" id="searchPhone" placeholder="请输入手机号码">
        </div>
        <div class="search-actions">
          <button class="btn btn-primary" onclick="handleSearch()">搜索</button>
          <button class="btn" onclick="resetSearch()">重置</button>
        </div>
      </div>

      <div id="loading" class="loading" style="display: none;">加载中...</div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th><input type="checkbox" id="selectAll"></th>
              <th>司机ID</th>
              <th>平台</th>
              <th>司机姓名</th>
              <th>手机号码</th>
              <th>车牌</th>
              <th>备注</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="driversTableBody">
          </tbody>
        </table>
      </div>

      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <div id="driverModal" style="display: none;">
    <div class="modal-overlay" onclick="closeDriverModal(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
          <h3 id="modalTitle">新增司机</h3>
          <button class="modal-close" onclick="closeDriverModal()">&times;</button>
        </div>
        <div class="modal-body">
          <form id="driverForm">
            <input type="hidden" id="driverId">
            <div class="form-group">
              <label>司机姓名 <span style="color: #f56c6c">*</span></label>
              <input type="text" id="driverName" placeholder="请输入司机姓名" required>
            </div>
            <div class="form-group">
              <label>平台 <span style="color: #f56c6c">*</span></label>
              <input type="text" id="platform" placeholder="请输入平台" required>
            </div>
            <div class="form-group">
              <label>手机号码 <span style="color: #f56c6c">*</span></label>
              <input type="text" id="driverPhone" placeholder="请输入手机号码" required>
            </div>
            <div class="form-group">
              <label>车牌号</label>
              <select id="plateNumber" style="width: 100%; padding: 8px 12px; border: 1px solid #dcdfe6; border-radius: 4px;">
                <option value="">请选择车牌号</option>
              </select>
            </div>
            <div class="form-group">
              <label>备注</label>
              <textarea id="remark" rows="2" placeholder="请输入备注"></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn" onclick="closeDriverModal()">取消</button>
          <button class="btn btn-primary" onclick="saveDriver()">保存</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/utils.js"></script>
  <script>
    let driversList = [];
    let currentPage = 1;
    let pageSize = 10;
    let total = 0;
    let isEdit = false;

    async function loadDrivers() {
      const loading = document.getElementById('loading');
      loading.style.display = 'flex';

      const searchName = document.getElementById('searchName').value;
      const searchPhone = document.getElementById('searchPhone').value;

      try {
        const params = { page: currentPage, page_size: pageSize };
        if (searchName) params.driver_name = searchName;
        if (searchPhone) params.driver_phone = searchPhone;

        const url = searchName || searchPhone ? '/drivers/search/' : '/drivers/';
        const response = await http.get(url, params);

        driversList = response.data || [];
        total = driversList.length;
        renderTable();
        renderPagination();
      } catch (error) {
        console.error('获取司机列表失败:', error);
        showMessage('获取司机列表失败', 'error');
      } finally {
        loading.style.display = 'none';
      }
    }

    function renderTable() {
      const tbody = document.getElementById('driversTableBody');
      tbody.innerHTML = '';

      driversList.forEach(driver => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><input type="checkbox" data-id="${driver.id}"></td>
          <td>${driver.id}</td>
          <td>${driver.platform || '-'}</td>
          <td>${driver.driver_name}</td>
          <td>${driver.driver_phone}</td>
          <td>${driver.plate_numbers || '-'}</td>
          <td>${driver.remarks || '-'}</td>
          <td class="action-buttons">
            <button class="btn btn-small" onclick="editDriver(${driver.id})">编辑</button>
            <button class="btn btn-small btn-danger" onclick="deleteDriver(${driver.driver_id})">删除</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function renderPagination() {
      const totalPages = Math.ceil(total / pageSize) || 1;
      const pagination = document.getElementById('pagination');
      pagination.innerHTML = '';

      const prevBtn = document.createElement('button');
      prevBtn.textContent = '上一页';
      prevBtn.disabled = currentPage <= 1;
      prevBtn.onclick = () => { currentPage--; loadDrivers(); };
      pagination.appendChild(prevBtn);

      for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement('button');
        btn.textContent = i;
        if (i === currentPage) btn.classList.add('active');
        btn.onclick = () => { currentPage = i; loadDrivers(); };
        pagination.appendChild(btn);
      }

      const nextBtn = document.createElement('button');
      nextBtn.textContent = '下一页';
      nextBtn.disabled = currentPage >= totalPages;
      nextBtn.onclick = () => { currentPage++; loadDrivers(); };
      pagination.appendChild(nextBtn);

      const info = document.createElement('span');
      info.className = 'page-info';
      info.textContent = `共 ${total} 条记录`;
      info.style.marginLeft = '15px';
      pagination.appendChild(info);
    }

    function handleSearch() {
      currentPage = 1;
      loadDrivers();
    }

    function resetSearch() {
      document.getElementById('searchName').value = '';
      document.getElementById('searchPhone').value = '';
      currentPage = 1;
      loadDrivers();
    }

    function openDriverDialog(driver = null) {
      isEdit = !!driver;
      document.getElementById('modalTitle').textContent = isEdit ? '编辑司机' : '新增司机';
      document.getElementById('driverForm').reset();
      document.getElementById('driverId').value = '';

      if (driver) {
        document.getElementById('driverId').value = driver.id;
        document.getElementById('driverName').value = driver.driver_name;
        document.getElementById('platform').value = driver.platform;
        document.getElementById('driverPhone').value = driver.driver_phone;
        document.getElementById('plateNumber').value = driver.plate_number || '';
        document.getElementById('remark').value = driver.remarks || '';
      }

      loadCarOptions(driver?.plate_number);
      document.getElementById('driverModal').style.display = 'block';
    }

    async function loadCarOptions(selectedPlate = '') {
      try {
        const res = await http.get('/cars/search/plateNumber', { q: '' });
        const options = res.data || [];
        const select = document.getElementById('plateNumber');
        select.innerHTML = '<option value="">请选择车牌号</option>';
        options.forEach(car => {
          const opt = document.createElement('option');
          opt.value = car.plate_number;
          opt.textContent = car.plate_number;
          if (car.plate_number === selectedPlate) opt.selected = true;
          select.appendChild(opt);
        });
      } catch (error) {
        console.error('加载车牌列表失败:', error);
      }
    }

    function closeDriverModal(event) {
      if (event && event.target !== event.currentTarget) return;
      document.getElementById('driverModal').style.display = 'none';
    }

    async function saveDriver() {
      const name = document.getElementById('driverName').value.trim();
      const phone = document.getElementById('driverPhone').value.trim();
      const platform = document.getElementById('platform').value.trim();
      const plateNumber = document.getElementById('plateNumber').value;
      const remark = document.getElementById('remark').value.trim();
      const id = document.getElementById('driverId').value;

      if (!name) {
        showMessage('请输入司机姓名', 'error');
        return;
      }

      if (!/^1[3-9]\d{9}$/.test(phone)) {
        showMessage('请输入正确的手机号码', 'error');
        return;
      }

      const formData = {
        driver_name: name,
        driver_phone: phone,
        plate_number: plateNumber,
        remarks: remark
      };

      try {
        if (isEdit) {
          formData.platform_id = id;
          await http.put(`/drivers/${id}`, formData);
          showMessage('编辑成功', 'success');
        } else {
          await http.post('/drivers/', formData);
          showMessage('新增成功', 'success');
        }
        closeDriverModal();
        loadDrivers();
      } catch (error) {
        console.error('保存司机失败:', error);
        showMessage(error.message || '保存失败', 'error');
      }
    }

    async function editDriver(id) {
      const driver = driversList.find(d => d.id === id);
      if (driver) {
        openDriverDialog(driver);
      }
    }

    async function deleteDriver(driverId) {
      const confirmed = await showConfirm('确定要删除该司机信息吗？', '删除确认');
      if (!confirmed) return;

      try {
        await http.delete(`/drivers/${driverId}`);
        showMessage('删除成功', 'success');
        loadDrivers();
      } catch (error) {
        console.error('删除司机失败:', error);
        showMessage('删除失败', 'error');
      }
    }

    document.getElementById('selectAll').addEventListener('change', function() {
      const checkboxes = document.querySelectorAll('#driversTableBody input[type="checkbox"]');
      checkboxes.forEach(cb => cb.checked = this.checked);
    });

    loadDrivers();
  </script>
</body>
</html>
