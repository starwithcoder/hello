<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>换车记录管理</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { background-color: #f5f7fa; min-height: 100vh; margin: 0; padding: 20px; }
    .page-header { margin-bottom: 30px; }
    .page-title { font-size: 28px; font-weight: bold; margin: 0 0 8px 0; color: #303133; }
    .page-subtitle { font-size: 14px; color: #909399; margin: 0; }
    .card { background-color: #fff; border-radius: 4px; box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1); margin-bottom: 20px; }
    .card-header { padding: 15px 20px; border-bottom: 1px solid #ebeef5; display: flex; justify-content: space-between; align-items: center; }
    .card-header span { font-size: 18px; font-weight: 600; color: #303133; }
    .card-body { padding: 20px; }
    .search-form { display: flex; flex-wrap: wrap; gap: 15px; padding: 15px; background-color: #f0f2f5; border-radius: 4px; margin-bottom: 20px; }
    .search-item { display: flex; align-items: center; gap: 10px; }
    .search-item label { white-space: nowrap; color: #606266; font-weight: 500; }
    .search-item input { padding: 8px 12px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 14px; min-width: 150px; }
    .search-item input:focus { outline: none; border-color: #409eff; }
    .search-actions { display: flex; gap: 10px; margin-left: auto; }
    table { width: 100%; border-collapse: collapse; }
    table th, table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ebeef5; }
    table th { background-color: #f5f7fa; font-weight: 600; color: #606266; }
    table tbody tr:hover { background-color: #f5f7fa; }
    .btn { padding: 8px 16px; border-radius: 4px; border: 1px solid #dcdfe6; background-color: #fff; color: #606266; cursor: pointer; font-size: 14px; transition: all 0.3s; }
    .btn:hover { border-color: #409eff; color: #409eff; }
    .btn-primary { background-color: #409eff; border-color: #409eff; color: #fff; }
    .btn-primary:hover { background-color: #66b1ff; border-color: #66b1ff; }
    .btn-danger { background-color: #f56c6c; border-color: #f56c6c; color: #fff; }
    .btn-danger:hover { background-color: #f78989; border-color: #f78989; }
    .btn-small { padding: 5px 10px; font-size: 12px; }
    .pagination { margin-top: 20px; display: flex; justify-content: flex-end; align-items: center; gap: 5px; }
    .pagination button { padding: 6px 12px; border: 1px solid #dcdfe6; background-color: #fff; color: #606266; cursor: pointer; border-radius: 4px; }
    .pagination button:hover:not(:disabled) { border-color: #409eff; color: #409eff; }
    .pagination button.active { background-color: #409eff; border-color: #409eff; color: #fff; }
    .pagination button:disabled { opacity: 0.5; cursor: not-allowed; }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background-color: rgba(0, 0, 0, 0.5); display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .modal { background-color: #fff; border-radius: 4px; min-width: 400px; max-width: 90vw; max-height: 90vh; overflow: auto; }
    .modal-header { padding: 15px 20px; border-bottom: 1px solid #ebeef5; display: flex; justify-content: space-between; align-items: center; }
    .modal-header h3 { font-size: 18px; font-weight: 600; margin: 0; }
    .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: #909399; }
    .modal-close:hover { color: #606266; }
    .modal-body { padding: 20px; }
    .modal-footer { padding: 15px 20px; border-top: 1px solid #ebeef5; display: flex; justify-content: flex-end; gap: 10px; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: 500; color: #606266; }
    .form-group input { width: 100%; padding: 8px 12px; border: 1px solid #dcdfe6; border-radius: 4px; font-size: 14px; box-sizing: border-box; }
    .form-group input:focus { outline: none; border-color: #409eff; }
    .loading { display: flex; justify-content: center; align-items: center; padding: 40px; color: #909399; }
    .loading::after { content: ''; width: 30px; height: 30px; border: 3px solid #dcdfe6; border-top-color: #409eff; border-radius: 50%; animation: spin 1s linear infinite; margin-left: 10px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .action-buttons { display: flex; gap: 5px; }
  </style>
</head>
<body>
  <div class="page-header">
    <h1 class="page-title">换车记录管理</h1>
    <p class="page-subtitle">管理换车记录信息</p>
  </div>

  <div class="card">
    <div class="card-header">
      <span>换车记录列表</span>
      <button class="btn btn-primary" onclick="openChangeDialog()">+ 新增换车记录</button>
    </div>
    <div class="card-body">
      <div class="search-form">
        <div class="search-item">
          <label>司机姓名:</label>
          <input type="text" id="searchDriver" placeholder="请输入司机姓名">
        </div>
        <div class="search-item">
          <label>原车牌号:</label>
          <input type="text" id="searchOriginal" placeholder="请输入原车牌号">
        </div>
        <div class="search-item">
          <label>更换后车牌号:</label>
          <input type="text" id="searchNew" placeholder="请输入更换后车牌号">
        </div>
        <div class="search-actions">
          <button class="btn btn-primary" onclick="handleSearch()">搜索</button>
          <button class="btn" onclick="resetSearch()">重置</button>
        </div>
      </div>

      <div id="loading" class="loading" style="display: none;">加载中...</div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th><input type="checkbox" id="selectAll"></th>
              <th>ID</th>
              <th>司机姓名</th>
              <th>换车时间</th>
              <th>原车牌</th>
              <th>更换后车牌</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="changeTableBody"></tbody>
        </table>
      </div>

      <div class="pagination" id="pagination"></div>
    </div>
  </div>

  <div id="changeModal" style="display: none;">
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
          <h3 id="modalTitle">新增换车记录</h3>
          <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
          <form id="changeForm">
            <input type="hidden" id="changeId">
            <div class="form-group">
              <label>司机ID</label>
              <input type="text" id="driverId" placeholder="请输入司机ID">
            </div>
            <div class="form-group">
              <label>司机姓名 <span style="color: #f56c6c">*</span></label>
              <input type="text" id="driverName" placeholder="请输入司机姓名" required>
            </div>
            <div class="form-group">
              <label>换车时间 <span style="color: #f56c6c">*</span></label>
              <input type="datetime-local" id="changeTime" required>
            </div>
            <div class="form-group">
              <label>原车牌 <span style="color: #f56c6c">*</span></label>
              <input type="text" id="originalPlate" placeholder="请输入原车牌号" required>
            </div>
            <div class="form-group">
              <label>更换后车牌 <span style="color: #f56c6c">*</span></label>
              <input type="text" id="newPlate" placeholder="请输入更换后车牌号" required>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button class="btn" onclick="closeModal()">取消</button>
          <button class="btn btn-primary" onclick="saveChange()">保存</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/utils.js"></script>
  <script>
    let changeList = [];
    let currentPage = 1;
    let pageSize = 10;
    let total = 0;
    let isEdit = false;

    async function loadChange() {
      const loading = document.getElementById('loading');
      loading.style.display = 'flex';

      const searchDriver = document.getElementById('searchDriver').value;
      const searchOriginal = document.getElementById('searchOriginal').value;
      const searchNew = document.getElementById('searchNew').value;

      try {
        const params = {};
        if (searchDriver) params.driver_name = searchDriver;
        if (searchOriginal) params.original_plate = searchOriginal;
        if (searchNew) params.new_plate = searchNew;

        const response = await http.get('/vehicle_change/', params);
        changeList = response.data || [];
        total = changeList.length;
        renderTable();
        renderPagination();
      } catch (error) {
        console.error('获取换车记录失败:', error);
        showMessage('获取换车记录失败', 'error');
      } finally {
        loading.style.display = 'none';
      }
    }

    function renderTable() {
      const tbody = document.getElementById('changeTableBody');
      tbody.innerHTML = '';

      changeList.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><input type="checkbox" data-id="${item.id}"></td>
          <td>${item.id}</td>
          <td>${item.driver_name || '-'}</td>
          <td>${item.change_time || '-'}</td>
          <td>${item.original_plate || '-'}</td>
          <td>${item.new_plate || '-'}</td>
          <td class="action-buttons">
            <button class="btn btn-small" onclick="editChange(${item.id})">编辑</button>
            <button class="btn btn-small btn-danger" onclick="deleteChange(${item.id})">删除</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function renderPagination() {
      const totalPages = Math.ceil(total / pageSize) || 1;
      const pagination = document.getElementById('pagination');
      pagination.innerHTML = '';

      const prevBtn = document.createElement('button');
      prevBtn.textContent = '上一页';
      prevBtn.disabled = currentPage <= 1;
      prevBtn.onclick = () => { currentPage--; loadChange(); };
      pagination.appendChild(prevBtn);

      for (let i = 1; i <= totalPages; i++) {
        const btn = document.createElement('button');
        btn.textContent = i;
        if (i === currentPage) btn.classList.add('active');
        btn.onclick = () => { currentPage = i; loadChange(); };
        pagination.appendChild(btn);
      }

      const nextBtn = document.createElement('button');
      nextBtn.textContent = '下一页';
      nextBtn.disabled = currentPage >= totalPages;
      nextBtn.onclick = () => { currentPage++; loadChange(); };
      pagination.appendChild(nextBtn);
    }

    function handleSearch() { currentPage = 1; loadChange(); }
    function resetSearch() {
      document.getElementById('searchDriver').value = '';
      document.getElementById('searchOriginal').value = '';
      document.getElementById('searchNew').value = '';
      currentPage = 1;
      loadChange();
    }

    function openChangeDialog(item = null) {
      isEdit = !!item;
      document.getElementById('modalTitle').textContent = isEdit ? '编辑换车记录' : '新增换车记录';
      document.getElementById('changeForm').reset();
      document.getElementById('changeId').value = '';

      if (item) {
        document.getElementById('changeId').value = item.id;
        document.getElementById('driverId').value = item.id;
        document.getElementById('driverName').value = item.driver_name || '';
        document.getElementById('changeTime').value = item.change_time ? item.change_time.replace(' ', 'T') : '';
        document.getElementById('originalPlate').value = item.original_plate || '';
        document.getElementById('newPlate').value = item.new_plate || '';
      }

      document.getElementById('changeModal').style.display = 'block';
    }

    function closeModal(event) {
      if (event && event.target !== event.currentTarget) return;
      document.getElementById('changeModal').style.display = 'none';
    }

    async function saveChange() {
      const formData = {
        driver_name: document.getElementById('driverName').value,
        change_time: document.getElementById('changeTime').value.replace('T', ' '),
        original_plate: document.getElementById('originalPlate').value,
        new_plate: document.getElementById('newPlate').value
      };

      const id = document.getElementById('changeId').value;

      try {
        if (isEdit) {
          formData.id = id;
          await http.put(`/vehicle_change/edit/${id}`, formData);
          showMessage('编辑成功', 'success');
        } else {
          await http.post('/vehicle_change/add', formData);
          showMessage('新增成功', 'success');
        }
        closeModal();
        loadChange();
      } catch (error) {
        showMessage(error.message || '保存失败', 'error');
      }
    }

    function editChange(id) {
      const item = changeList.find(c => c.id === id);
      if (item) openChangeDialog(item);
    }

    async function deleteChange(id) {
      const confirmed = await showConfirm('确定要删除该换车记录吗？', '删除确认');
      if (!confirmed) return;
      try {
        await http.delete(`/vehicle_change/delete/${id}`);
        showMessage('删除成功', 'success');
        loadChange();
      } catch (error) {
        showMessage('删除失败', 'error');
      }
    }

    document.getElementById('selectAll').addEventListener('change', function() {
      document.querySelectorAll('#changeTableBody input[type="checkbox"]').forEach(cb => cb.checked = this.checked);
    });

    loadChange();
  </script>
</body>
</html>
