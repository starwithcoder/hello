<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - 车辆管理系统</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #4886e3;
      background-image: url('../static/imgs/loginbg3.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      background-position: center center;
    }

    .login-container {
      width: 100%;
      max-width: 400px;
      padding: 30px;
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
    }

    .login-title {
      text-align: center;
      margin-bottom: 24px;
      color: #303133;
      font-size: 24px;
    }

    .login-form {
      width: 100%;
    }

    .form-group label {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
      color: #606266;
    }

    .form-control {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #dcdfe6;
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
    }

    .form-control:focus {
      outline: none;
      border-color: #409eff;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: #909399;
    }

    .form-control.with-icon {
      padding-left: 35px;
    }

    .error-message {
      color: #f56c6c;
      font-size: 12px;
      margin-top: 5px;
    }

    .login-button {
      width: 100%;
      padding: 12px;
      background-color: #409eff;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .login-button:hover {
      background-color: #66b1ff;
    }

    .login-button:disabled {
      background-color: #a0cfff;
      cursor: not-allowed;
    }

    .register-link {
      text-align: center;
      margin-top: 20px;
      color: #606266;
      font-size: 14px;
    }

    .register-link a {
      color: #409eff;
      text-decoration: none;
    }

    .register-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h2 class="login-title">登录</h2>
    <form class="login-form" id="loginForm">
      <div class="form-group">
        <label for="username">用户名</label>
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input type="text" id="username" name="username" class="form-control with-icon" placeholder="请输入用户名" required>
        </div>
        <div class="error-message" id="usernameError"></div>
      </div>
      <div class="form-group">
        <label for="password">密码</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input type="password" id="password" name="password" class="form-control with-icon" placeholder="请输入密码" required>
        </div>
        <div class="error-message" id="passwordError"></div>
      </div>
      <div class="form-group">
        <button type="submit" class="login-button" id="loginBtn">登录</button>
      </div>
    </form>
    <div class="register-link">
      <span>还没有账号？</span>
      <a href="register.html">去注册</a>
    </div>
  </div>

  <script src="../js/utils.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const loginBtn = document.getElementById('loginBtn');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const usernameError = document.getElementById('usernameError');
    const passwordError = document.getElementById('passwordError');

    function validateForm() {
      let isValid = true;
      usernameError.textContent = '';
      passwordError.textContent = '';

      if (!usernameInput.value.trim()) {
        usernameError.textContent = '请输入用户名';
        isValid = false;
      } else if (usernameInput.value.length < 3 || usernameInput.value.length > 20) {
        usernameError.textContent = '用户名长度在 3 到 20 个字符';
        isValid = false;
      }

      if (!passwordInput.value.trim()) {
        passwordError.textContent = '请输入密码';
        isValid = false;
      } else if (passwordInput.value.length < 6 || passwordInput.value.length > 20) {
        passwordError.textContent = '密码长度在 6 到 20 个字符';
        isValid = false;
      }

      return isValid;
    }

    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      if (!validateForm()) {
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = '登录中...';

      try {
        const response = await http.post('/login', {
          username: usernameInput.value,
          password: passwordInput.value
        });

        if (response.status === 200 || response.token) {
          localStorage.setItem('isLoggedIn', 'true');
          if (response.token) {
            localStorage.setItem('token', response.token);
          }
          showMessage('登录成功', 'success');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 500);
        } else {
          showMessage(response.message || '登录失败，请检查账号密码', 'error');
        }
      } catch (error) {
        console.error('登录请求失败:', error);
        showMessage(error.message || '登录失败，请稍后重试', 'error');
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = '登录';
      }
    });

    usernameInput.addEventListener('blur', validateForm);
    passwordInput.addEventListener('blur', validateForm);
  </script>
</body>
</html>
